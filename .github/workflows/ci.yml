name: CI

on:
  push:
  pull_request:

# Least privilege for the default token (C-2). Matches nightly-e2e.yml.
permissions:
  contents: read

jobs:
  managed:
    name: Managed build and tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2
      - name: Build test fixtures
        run: |
          msbuild tests/fixtures/AnalysisTarget.vcxproj /t:Build /p:Configuration=Release /p:Platform=x64 /m /v:minimal
          msbuild tests/fixtures/HostileStressTarget.vcxproj /t:Build /p:Configuration=Release /p:Platform=x64 /m /v:minimal
          msbuild tests/fixtures/HardenedStressTarget.vcxproj /t:Build /p:Configuration=Release /p:Platform=x64 /m /v:minimal
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x
      - name: Build managed solution filter
        run: dotnet build DbgLink.Managed.slnf --configuration Release
      - name: Run managed tests with coverage gate
        run: dotnet test tests/DbgLink.Tests/DbgLink.Tests.csproj --configuration Release --settings tests/DbgLink.Tests/coverlet.runsettings --logger "trx;LogFileName=full.trx" --results-directory tests/DbgLink.Tests/TestResults
      - name: Gate full suite (failed=0, total floor 1600)
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/check-test-floor.ps1 -TrxPath tests/DbgLink.Tests/TestResults/full.trx -Floor 1600
      - name: Run KEEP filter (security/wire insurance)
        run: dotnet test tests/DbgLink.Tests/DbgLink.Tests.csproj --configuration Release --filter "FullyQualifiedName~SecurityFix|FullyQualifiedName~CommandInjection|FullyQualifiedName~NativeAddressParity|FullyQualifiedName~ServerEndToEnd|FullyQualifiedName~SessionFallback" --logger "trx;LogFileName=keep.trx" --results-directory tests/DbgLink.Tests/TestResults
      - name: Gate KEEP filter (failed=0, total floor 334)
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/check-test-floor.ps1 -TrxPath tests/DbgLink.Tests/TestResults/keep.trx -Floor 334
      - name: Upload coverage artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-cobertura
          path: tests/DbgLink.Tests/TestResults/*/coverage.cobertura.xml
          if-no-files-found: error

  native:
    name: Native build and tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2
      - name: Build native x64
        run: msbuild src/native/DbgLink.Native/DbgLink.Native.vcxproj /t:Build /p:Configuration=Release /p:Platform=x64 /m /v:minimal
      - name: Build native JSON test harness
        run: msbuild tests/DbgLink.Native.Tests/DbgLink.Native.Tests.vcxproj /t:Build /p:Configuration=Release /p:Platform=x64 /m /v:minimal
      - name: Run native JSON tests
        run: bin\native-tests\x64\Release\DbgLink.Native.Json.Tests.exe
      - name: Build native Win32
        run: msbuild src/native/DbgLink.Native/DbgLink.Native.vcxproj /t:Build /p:Configuration=Release /p:Platform=Win32 /m /v:minimal
      - name: Build native JSON test harness (Win32)
        run: msbuild tests/DbgLink.Native.Tests/DbgLink.Native.Tests.vcxproj /t:Build /p:Configuration=Release /p:Platform=Win32 /m /v:minimal
      - name: Run native JSON tests (Win32)
        # The 32-bit build compiles the x86 ABI branches (sizeof(NativeBreakpoint),
        # the cdecl call frame, the x86 register table) that the x64 run never
        # executes, so it has to be built AND run here.
        run: bin\native-tests\Win32\Release\DbgLink.Native.Json.Tests.exe
      - name: Build test fixtures
        run: |
          msbuild tests/fixtures/AnalysisTarget.vcxproj /t:Build /p:Configuration=Release /p:Platform=x64 /m /v:minimal
          msbuild tests/fixtures/AnalysisTarget.vcxproj /t:Build /p:Configuration=Release /p:Platform=Win32 /m /v:minimal
          msbuild tests/fixtures/HostileStressTarget.vcxproj /t:Build /p:Configuration=Release /p:Platform=x64 /m /v:minimal
          msbuild tests/fixtures/HardenedStressTarget.vcxproj /t:Build /p:Configuration=Release /p:Platform=x64 /m /v:minimal

  ghidra:
    name: Ghidra extension build
    runs-on: windows-latest
    env:
      GHIDRA_VERSION: "12.1.3"
      GHIDRA_BUILD_DATE: "20260817"
      # C-1: official SHA-256 of ghidra_12.1.3_PUBLIC_20260817.zip, published in
      # the Ghidra 12.1.3 release notes and the release-asset digest. The
      # download step below fails closed on mismatch. Repin on every Ghidra bump.
      GHIDRA_SHA256: "93a5d11a9ad510622acaaf908c556a7b9b764d338e78a7567f3689bf5081fd54"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Cache Ghidra distribution
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ github.workspace }}\ghidra-dist
          key: ghidra-${{ env.GHIDRA_VERSION }}-${{ env.GHIDRA_BUILD_DATE }}
      - name: Download and unpack Ghidra
        shell: pwsh
        run: |
          $zip = "ghidra_${env:GHIDRA_VERSION}_PUBLIC_${env:GHIDRA_BUILD_DATE}.zip"
          $url = "https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_${env:GHIDRA_VERSION}_build/$zip"
          # C-1: verify before expand/exec — fail closed on hash mismatch or a
          # missing pin, so a compromised mirror cannot smuggle code into the build.
          if ([string]::IsNullOrWhiteSpace($env:GHIDRA_SHA256)) {
            throw "GHIDRA_SHA256 is not pinned; refusing to unpack an unverified Ghidra distribution."
          }
          if (-not (Test-Path $zip)) {
            Invoke-WebRequest -Uri $url -OutFile $zip
          }
          $actualSha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash.ToLowerInvariant()
          if ($actualSha256 -cne $env:GHIDRA_SHA256.ToLowerInvariant()) {
            throw "Ghidra zip SHA256 mismatch: expected $($env:GHIDRA_SHA256), got $actualSha256."
          }
          Expand-Archive -Path $zip -DestinationPath "ghidra-dist" -Force
          $ghidraHome = Get-ChildItem "ghidra-dist" -Directory | Select-Object -First 1 -ExpandProperty FullName
          Add-Content -Path $env:GITHUB_ENV -Value "DBGLINK_GHIDRA_HOME=$ghidraHome"
      - name: Build Ghidra extension (compile, checks, distribute)
        shell: pwsh
        run: |
          $ghidraHome = Get-ChildItem "ghidra-dist" -Directory | Select-Object -First 1 -ExpandProperty FullName
          $wrapper = Join-Path $ghidraHome "support\gradle\gradlew.bat"
          powershell -NoProfile -ExecutionPolicy Bypass -File tools/run-gradle.ps1 `
            -WrapperPath $wrapper `
            -ProjectPath src/ghidra/GhidraBridge `
            -GhidraHome $ghidraHome
      - name: Upload Ghidra extension
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: GhidraBridge
          path: src/ghidra/GhidraBridge/dist/*.zip
          if-no-files-found: error
      - name: Build AnalysisTarget fixture (x64)
        timeout-minutes: 15
        run: msbuild tests/fixtures/AnalysisTarget.vcxproj /t:Build /p:Configuration=Release /p:Platform=x64 /m /v:minimal
      - name: Run token-efficiency benchmark (headless Ghidra + jtokkit)
        timeout-minutes: 30
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ghidraHome = $env:DBGLINK_GHIDRA_HOME
          if ([string]::IsNullOrWhiteSpace($ghidraHome)) {
            $ghidraHome = Get-ChildItem "ghidra-dist" -Directory | Select-Object -First 1 -ExpandProperty FullName
          }
          $fixture = Join-Path $env:GITHUB_WORKSPACE 'artifacts\fixtures\x64\AnalysisTarget.exe'
          if (-not (Test-Path -LiteralPath $fixture -PathType Leaf)) { throw "Fixture not found at '$fixture'." }
          $distZip = Get-ChildItem -LiteralPath 'src/ghidra/GhidraBridge/dist' -Filter '*.zip' -File |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $distZip) { throw 'GhidraBridge dist zip not found under src/ghidra/GhidraBridge/dist.' }
          $stage = Join-Path $env:RUNNER_TEMP 'token-bench'
          if (Test-Path -LiteralPath $stage) { Remove-Item -LiteralPath $stage -Recurse -Force }
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Expand-Archive -LiteralPath $distZip -DestinationPath (Join-Path $stage 'extension') -Force
          $bridgeJar = Get-ChildItem -LiteralPath (Join-Path $stage 'extension') -Recurse -Filter 'GhidraBridge.jar' -File |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $bridgeJar) { throw 'GhidraBridge.jar not found inside the dist zip.' }
          $jtokkitJar = Join-Path $stage 'jtokkit-1.1.0.jar'
          # C-1: pinned SHA-256 of jtokkit-1.1.0.jar from Maven Central
          # (authenticity cross-checked against Maven's published .sha1
          # b7370f801db3eb8c7c6a2c2c06231909ac6de0b0). Fail closed on mismatch.
          $jtokkitSha256 = '1501ce0259ab897c6746ccfafa1d208acd404fb17e1ac62e157172f2678b1183'
          Invoke-WebRequest -Uri 'https://repo1.maven.org/maven2/com/knuddels/jtokkit/1.1.0/jtokkit-1.1.0.jar' -OutFile $jtokkitJar
          $actualJtokkit = (Get-FileHash -Algorithm SHA256 -LiteralPath $jtokkitJar).Hash.ToLowerInvariant()
          if ($actualJtokkit -cne $jtokkitSha256) {
            throw "jtokkit jar SHA256 mismatch: expected $jtokkitSha256, got $actualJtokkit."
          }
          $projDir = Join-Path $stage 'proj'
          New-Item -ItemType Directory -Path $projDir -Force | Out-Null
          $log = Join-Path $stage 'token-benchmark.log'
          $prevEap = $ErrorActionPreference
          try {
            $ErrorActionPreference = 'Continue'
            & (Join-Path $ghidraHome 'support\analyzeHeadless.bat') $projDir 'Bench' `
              -import $fixture -scriptPath (Join-Path $env:GITHUB_WORKSPACE 'tests\ghidra') `
              -postScript TokenEfficiencyBenchmark.java $bridgeJar $jtokkitJar -deleteProject 2>&1 |
              ForEach-Object { $_.ToString() } |
              Tee-Object -FilePath $log
            $headlessExit = $LASTEXITCODE
          } finally {
            $ErrorActionPreference = $prevEap
          }
          if ($headlessExit -ne 0 -or -not (Select-String -LiteralPath $log -SimpleMatch 'TOKEN_BENCHMARK_PASS' -Quiet)) {
            throw "Token-efficiency benchmark failed (exit=$headlessExit, missing TOKEN_BENCHMARK_PASS); see $log"
          }
      - name: Upload token-benchmark log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: token-benchmark-log
          path: ${{ runner.temp }}/token-bench/token-benchmark.log
          if-no-files-found: warn
